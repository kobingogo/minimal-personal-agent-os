[build-system]
requires = []
build-backend = "_paos_build"
backend-path = ["."]

[project]
name = "minimal-personal-agent-os"
version = "0.1.0"
description = "Zero-dependency Personal AI Agent OS control plane (nvm + chezmoi + guardrails for Claude Code, Codex, Antigravity & Cursor)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
  { name = "kobingogo", email = "kobingogo@users.noreply.github.com" }
]
keywords = ["ai-agent", "claude-code", "codex", "harness", "guardrails", "agent-os"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kobingogo/minimal-personal-agent-os"
Repository = "https://github.com/kobingogo/minimal-personal-agent-os"

[project.scripts]
paos = "paos.cli:main"

[tool.setuptools]
package-dir = { "" = "lib" }
packages = ["paos"]

[tool.setuptools.package-data]
paos = ["assets/*"]
